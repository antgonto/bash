# test environment — KEY=VALUE, one per line, # comments allowed. Parsed as data; never sourced.
# Mirrors Course 2's `test` environment (the staging cluster), on your laptop.
PORT=18080
PROJECT=fraudclf-test
# The program's model service, built locally from APP_DIR/Dockerfile.course.
# A locally built image has no registry digest; record-manifest.sh records its image ID.
APP_DIR=app
IMAGE_SERVE=fraudclf-serve:m0
# Pin by tag now; after your first `up`, append @sha256:<digest> copied from
#   docker image inspect --format '{{index .RepoDigests 0}}' nginx:1.27-alpine
# Never type a digest from a document — record the one your daemon pulled.
IMAGE_GATEWAY=nginx:1.27-alpine
HEALTH_PATH=/api/health
HEALTH_BODY={"status":"ok"}
WAIT_TIMEOUT=120
